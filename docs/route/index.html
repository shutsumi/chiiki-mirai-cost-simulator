<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>自宅から学校までの行き方｜地域みらい留学</title>
<meta name="description" content="地域みらい留学の学校を選ぶと、自宅から学校までのルートと運賃をGoogleマップで確認できます">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&display=swap">
<link rel="stylesheet" href="../style.css?v=20261120-2">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <p class="eyebrow">地域みらい留学</p>
    <h1><span class="h1-tail">自宅から学校までの</span><span class="h1-tail">行き方</span></h1>
    <p class="header-lead">学校を選ぶと、自宅からの<strong>ルートと運賃</strong>をGoogleマップで確認できます</p>
  </div>
</header>

<main class="wrap">
  <form id="sim-form" class="sim-card" novalidate>
    <div class="sim-step">
      <label class="sim-label" for="pref">学校のある都道府県</label>
      <select id="pref" class="select">
        <option value="">都道府県を選ぶ</option>
      </select>
    </div>
    <div class="sim-step">
      <label class="sim-label" for="school">志望校</label>
      <select id="school" class="select" disabled>
        <option value="">先に都道府県を選んでください</option>
      </select>
      <p class="field-error" id="school-error" hidden></p>
    </div>
    <div id="route-out" class="route-out" hidden>
      <p class="route-school" id="route-school"></p>
      <a id="route-btn" class="route-btn" href="#" target="_blank" rel="noopener"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span>行き方と運賃を調べる<small>Googleマップが開きます</small></span></a>
      <a id="school-link" class="route-sub-link" href="#" target="_blank" rel="noopener">学校ページを見る ↗</a>
    </div>
    <p class="sim-foot">※Googleマップで出発地にご自宅を入れると、ルートと運賃が表示されます<br>※便の少ない路線や船・飛行機の乗り継ぎは、実際と違うことがあります、交通機関の公式情報もあわせてご確認ください</p>
  </form>
</main>

<footer class="site-footer">
  <div class="wrap">
    <ul class="footer-links">
      <li><a class="is-internal" href="../">留学したら毎月いくら？シミュレーター</a></li>
      <li><a href="https://c-mirai.jp/" target="_blank" rel="noopener">地域みらい留学 公式サイト</a></li>
      <li><a href="https://c-platform.or.jp/" target="_blank" rel="noopener">一般財団法人 地域・教育魅力化プラットフォーム</a></li>
    </ul>
  </div>
</footer>

<script src="route.js?v=20261120-2"></script>
</body>
</html>
