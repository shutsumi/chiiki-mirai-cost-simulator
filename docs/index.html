<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>留学したら毎月いくら？シミュレーター｜地域みらい留学</title>
<meta name="description" content="地域みらい留学で入学後に毎月かかる費用の概算を、学校ごとに確認できるシミュレーターです">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <p class="eyebrow">地域みらい留学</p>
    <h1><span class="h1-tail">留学したら毎月いくら？</span><span class="h1-tail">シミュレーター</span></h1>
    <p class="header-lead">入学後に<strong>毎月かかる費用</strong>の概算を、学校ごとに確認できます</p>
  </div>
</header>

<main class="wrap">
  <!-- ===== 入力(ファーストビューに置く) ===== -->
  <form id="sim-form" class="sim-card" novalidate>
    <div class="sim-step">
      <label class="sim-label" for="pref">学校のある都道府県</label>
      <select id="pref" class="select">
        <option value="">都道府県を選ぶ</option>
      </select>
    </div>
    <div class="sim-step">
      <label class="sim-label" for="school">志望校</label>
      <select id="school" class="select" disabled>
        <option value="">先に都道府県を選んでください</option>
      </select>
      <p class="field-error" id="school-error" hidden></p>
    </div>
    <button type="submit" class="cta">毎月の概算費用を確認</button>
    <p class="sim-foot">学校ページの公表額をもとにした目安です</p>
  </form>

  <div id="result" class="result" hidden tabindex="-1"></div>

  <section class="notice" aria-labelledby="notice-title">
    <h2 id="notice-title">ご利用にあたって</h2>
    <ul>
      <li>金額は、地域みらい留学の各学校ページに載っている金額をもとにした<strong>目安</strong>です<br>実際の金額は、学校・自治体にご確認ください</li>
    </ul>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>学費・生活費のデータは「地域みらい留学」公式サイトの各校ページ(2026年9月29日時点)をもとにしています</p>
    <ul class="footer-links">
      <li><a href="https://c-mirai.jp/" target="_blank" rel="noopener">地域みらい留学 公式サイト</a></li>
      <li><a href="https://c-platform.or.jp/" target="_blank" rel="noopener">一般財団法人 地域・教育魅力化プラットフォーム</a></li>
    </ul>
  </div>
</footer>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
